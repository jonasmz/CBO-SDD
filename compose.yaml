services:
  dev:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Database__MigrateOnStartup: "true"
    volumes:
      - "${HOST_PROJECT_DIR:?set HOST_PROJECT_DIR to the repository path as seen by the host Docker daemon}:/workspace"
      - nuget-cache:/nuget
      - authservice-dev-data:/data

  dev-api:
    build:
      context: .
      dockerfile: Dockerfile.dev
    working_dir: /workspace
    user: "${LOCAL_UID:-1000}:${LOCAL_GID:-1000}"
    profiles: ["run"]
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      ASPNETCORE_URLS: http://+:8080
      Database__MigrateOnStartup: "true"
    command: dotnet run --no-launch-profile --project src/AuthService.Api
    ports:
      - "${DEV_API_PORT:-8081}:8080"
    volumes:
      - "${HOST_PROJECT_DIR:?set HOST_PROJECT_DIR to the repository path as seen by the host Docker daemon}:/workspace"
      - nuget-cache:/nuget
      - authservice-dev-data:/data

  tools:
    build:
      context: .
      dockerfile: Dockerfile.tools

  auth-api:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: "${APP_UID:?set APP_UID in .env}"
        APP_GID: "${APP_GID:?set APP_GID in .env}"
    env_file: .env
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
    user: "${APP_UID}:${APP_GID}"
    ports:
      - "${API_PORT:-8080}:8080"
    volumes:
      - authservice-data:/data
      - "${SIGNING_KEY_DIR:-${HOST_PROJECT_DIR}/secrets}:/run/secrets/signing:ro"

  migrate:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        APP_UID: "${APP_UID:?set APP_UID in .env}"
        APP_GID: "${APP_GID:?set APP_GID in .env}"
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      Database__MigrateOnStartup: "false"
    user: "${APP_UID}:${APP_GID}"
    command: ["--migrate"]
    volumes:
      - authservice-data:/data

volumes:
  authservice-dev-data:
    name: authservice-dev-data
  authservice-data:
    name: authservice-data
  nuget-cache:
    name: nuget-cache
